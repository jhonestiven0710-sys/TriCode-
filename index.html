<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>triCode</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
</head>
<body>

<!-- INICIO -->
<main id="menu-screen" class="main-container">
    <header>
        <div class="gem-badge" id="gem-badge"><i class="fa-solid fa-gem"></i> <span id="gem-count">0</span></div>
        <h1 class="game-title">
            <span class="title-tri">tri</span><span class="title-code">Code</span><span class="cursor"></span>
        </h1>
        <p class="subtitle">3 en raya · online o cara a cara</p>
    </header>

    <section>
        <div class="profile-block">
            <div class="avatar-circle" id="avatar-circle">?</div>
            <div class="profile-info">
                <span class="profile-name" id="profile-name-display">Jugador</span>
                <input type="text" id="username" class="profile-name-input hidden" placeholder="Ej. ProPlayer" maxlength="12">
            </div>
            <button class="icon-btn small" id="btn-edit-name" title="Cambiar nombre"><i class="fa-solid fa-pen"></i></button>
        </div>

        <button id="btn-open-play" class="cta-play">
            <i class="fa-solid fa-gamepad"></i> JUGAR
        </button>

        <div class="quick-actions">
            <button id="btn-shop" class="quick-action-btn">
                <i class="fa-solid fa-store"></i>
                <span>Fichas</span>
            </button>
            <button id="btn-history" class="quick-action-btn">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Historial</span>
            </button>
        </div>
    </section>
</main>

<!-- SELECCIÓN DE MODO -->
<main id="play-screen" class="main-container hidden">
    <div class="history-header">
        <button id="btn-play-back" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 class="history-title">Elige tu modo</h2>
        <span style="width:36px;"></span>
    </div>

    <div class="input-group hidden" id="local-name-group">
        <label for="username2"><i class="fa-solid fa-user"></i> Nombre del Jugador 2</label>
        <input type="text" id="username2" placeholder="Ej. Retador" maxlength="12">
    </div>

    <div class="mode-buttons">
        <button id="btn-create" class="btn btn-mode btn-create">
            <span class="btn-icon"><i class="fa-solid fa-tower-broadcast"></i></span>
            <span class="btn-text"><strong>Crear sala</strong><small>Online · comparte el código con tu rival</small></span>
        </button>

        <div class="join-row">
            <input type="text" id="room-code-input" placeholder="CÓDIGO" maxlength="4">
            <button id="btn-join" class="btn btn-join-action btn-join-action">
                <i class="fa-solid fa-right-to-bracket"></i> Unirme
            </button>
        </div>

        <button id="btn-local" class="btn btn-mode btn-local">
            <span class="btn-icon"><i class="fa-solid fa-users"></i></span>
            <span class="btn-text"><strong>Dos jugadores</strong><small>Mismo dispositivo, por turnos</small></span>
        </button>

        <div id="local-setup" class="local-setup hidden">
            <button id="btn-local-start" class="btn btn-primary">
                <i class="fa-solid fa-play"></i> Empezar partida
            </button>
        </div>
    </div>
</main>

<!-- HISTORIAL DE PARTIDAS -->
<main id="history-screen" class="main-container hidden">
    <div class="history-header">
        <button id="btn-history-back" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 class="history-title">Historial</h2>
        <button id="btn-history-clear" class="icon-btn" title="Borrar historial"><i class="fa-solid fa-trash"></i></button>
    </div>
    <div id="history-list" class="history-list"></div>
</main>

<!-- TIENDA DE FICHAS -->
<main id="shop-screen" class="main-container hidden">
    <div class="history-header">
        <button id="btn-shop-back" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
        <h2 class="history-title">Tienda</h2>
        <div class="gem-badge"><i class="fa-solid fa-gem"></i> <span id="gem-count-shop">0</span></div>
    </div>
    <p class="shop-hint">Gana <strong>+2 💎</strong> por cada partida <strong>online</strong> que ganes. El modo de un solo dispositivo no otorga gemas.</p>
    <div id="shop-list" class="shop-list"></div>
</main>

<!-- TABLERO DE JUEGO -->
<main id="game-screen" class="main-container hidden">
    <header>
        <div class="room-info hidden" id="room-info">
            SALA <strong id="display-room-code">----</strong>
        </div>
        <div class="turn-status" id="turn-status">
            <p id="status-text">Esperando rival...</p>
        </div>
        <div class="score-bar">
            <span class="score-x"><span id="label-x">X</span> <strong id="score-x">0</strong></span>
            <span>Empates <strong id="score-d">0</strong></span>
            <span class="score-o"><span id="label-o">O</span> <strong id="score-o">0</strong></span>
        </div>
        <p class="round-indicator hidden" id="round-indicator">Ronda 1</p>
    </header>

    <section class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </section>

    <div class="game-actions">
        <button id="btn-restart" class="btn btn-secondary2 hidden">
            <i class="fa-solid fa-rotate-right"></i> Revancha
        </button>
        <button id="btn-leave" class="btn btn-danger">
            <i class="fa-solid fa-door-open"></i> Salir
        </button>
    </div>
</main>


<script src="script.js"></script>
</body>
</html>
